# Full-stack local development environment
# Usage: docker compose up

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: diabetes-db
    environment:
      POSTGRES_DB: diabetes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask backend API
  backend:
    build: ./backend
    container_name: diabetes-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diabetes_db
      SECRET_KEY: local-dev-secret-key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      gunicorn --bind 0.0.0.0:5000 --workers 2 --reload wsgi:app

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diabetes-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

  # pgAdmin (optional — for DB inspection)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diabetes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dtu.dk
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
