# Full-stack local development environment
# Usage: docker compose up

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: diabetes-db
    environment:
      POSTGRES_DB: diabetes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASP.NET Core backend API
  backend:
    build: ./backend
    container_name: diabetes-backend
    ports:
      - "8000:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diabetes_db
      CORS_ORIGINS: "*"
      ML_URL: http://ml:5001
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  # ML inference microservice (stateless Flask, port 5001)
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: diabetes-ml
    ports:
      - "5001:5001"
    environment:
      DETECTOR_CKPT: /app/ml/data/checkpoints/xchannel_nll_pooled_best.pt
    # checkpoint mounted read-only — swap the deliverable model without rebuilding
    volumes:
      - ./ml/data/checkpoints:/app/ml/data/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diabetes-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  # pgAdmin (optional — for DB inspection)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diabetes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dtu.dk
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
