name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Backend (C# ASP.NET Core API) ──────────────────────────────────────────────
  backend:
    name: "backend"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore DiabetesApi.slnx

      - name: Build (no restore)
        working-directory: backend
        run: dotnet build DiabetesApi.slnx --no-restore -c Release

      - name: Run tests (in-memory DB — no Postgres needed)
        working-directory: backend
        run: dotnet test DiabetesApi.Tests/DiabetesApi.Tests.csproj --no-build -c Release --verbosity normal

  # ── ML Module (Python) ──────────────────────────────────────────────────────
  ml:
    name: "ml"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ml dependencies
        working-directory: ml
        run: uv pip install --system -r requirements.txt

      - name: Run tests
        working-directory: ml
        run: python -m pytest tests/ -v

  # ── Frontend (React NextJS) ─────────────────────────────────────────────────────────────────
  frontend:
    name: "frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build
