name: GitHub CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── C# Backend ──────────────────────────────────────────────────────────────
  backend:
    name: "backend"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore DiabetesApi.slnx

      - name: Build (no restore)
        working-directory: backend
        run: dotnet build DiabetesApi.slnx --no-restore -c Release

      - name: Run tests (in-memory DB — no Postgres needed)
        working-directory: backend
        run: dotnet test DiabetesApi.Tests/DiabetesApi.Tests.csproj --no-build -c Release --verbosity normal

  # ── ML Module (Python) ──────────────────────────────────────────────────────
  ml:
    name: "ml"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install ml dependencies
        working-directory: ml
        run: pip install -r requirements.txt

  # ── React NextJS Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: "frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build
